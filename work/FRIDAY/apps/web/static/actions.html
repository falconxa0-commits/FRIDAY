<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIDAY — Action Approval Panel</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
  <div class="page-layout">
    <aside class="page-sidebar">
      <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Chat
      </a>
      <div style="margin-bottom:24px">
        <div class="logo">
          <div class="logo-icon">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <circle cx="14" cy="14" r="12" stroke="#6C63FF" stroke-width="2"/>
              <circle cx="14" cy="14" r="5" fill="#6C63FF"/>
              <circle cx="14" cy="14" r="3" fill="#0D1117"/>
            </svg>
          </div>
          <span class="logo-text">FRIDAY</span>
        </div>
      </div>

      <nav style="display:flex;flex-direction:column;gap:4px">
        <a href="#" class="nav-item active" onclick="showTab('pending', this); return false;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Pending</span>
          <span class="badge" id="pendingBadge" style="display:none">0</span>
        </a>
        <a href="#" class="nav-item" onclick="showTab('history', this); return false;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>History</span>
        </a>
      </nav>

      <div class="sidebar-footer" style="margin-top:auto">
        <div style="padding:12px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border)">
          <h4 style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:8px">Autonomy Profile</h4>
          <div id="autonomyProfile" style="font-size:13px;color:var(--accent);font-weight:600">GUEST</div>
          <p style="font-size:11px;color:var(--text-muted);margin-top:4px">All actions require approval</p>
        </div>
      </div>
    </aside>

    <main class="page-main">
      <div class="page-header">
        <h1>Action Approval Panel</h1>
        <div style="display:flex;gap:8px">
          <button class="btn-secondary" onclick="refreshPending()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
          <button class="btn-success" onclick="approveAll()">Approve All</button>
          <button class="btn-danger" onclick="rejectAll()">Reject All</button>
        </div>
      </div>

      <!-- Pending Tab -->
      <section id="tabPending" class="tab active">
        <div id="pendingList" class="actions-list">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </section>

      <!-- History Tab -->
      <section id="tabHistory" class="tab" style="display:none">
        <div id="historyList" class="actions-list">
          <div class="empty-state">
            <p>Action history will appear here</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_BASE = window.location.origin;
    let actionHistory = [];

    function getHeaders() {
      const token = localStorage.getItem('friday_token') || 'dev_token';
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, c => map[c]);
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Navigation
    function showTab(name, el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      if (el) el.classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.style.display = 'none');
      const tab = document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1));
      if (tab) tab.style.display = 'block';
    }

    // Load pending actions
    function refreshPending() {
      const list = document.getElementById('pendingList');
      list.innerHTML = '<div class="skeleton-card"></div><div class="skeleton-card"></div>';
      
      fetch(`${API_BASE}/api/actions/`, { headers: getHeaders() })
        .then(r => r.json())
        .then(data => {
          const pending = data.pending || [];
          
          // Update badge
          const badge = document.getElementById('pendingBadge');
          if (pending.length > 0) {
            badge.style.display = 'inline';
            badge.textContent = pending.length;
          } else {
            badge.style.display = 'none';
          }
          
          renderPending(pending);
        })
        .catch(err => {
          list.innerHTML = `<div class="empty-state"><p>Error: ${err.message}</p></div>`;
        });
    }

    function renderPending(actions) {
      const list = document.getElementById('pendingList');
      
      if (actions.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#30363D" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <p>No pending actions</p>
            <span style="font-size:12px;color:var(--text-muted)">All actions are approved or none have been requested</span>
          </div>
        `;
        return;
      }
      
      list.innerHTML = actions.map(action => {
        const risk = action.risk_level || 'low';
        const timestamp = action.timestamp ? new Date(action.timestamp).toLocaleString() : '';
        const paramsStr = action.params ? JSON.stringify(action.params, null, 2) : '{}';
        
        // Risk indicator color
        const riskColors = {
          low: { bg: 'rgba(63,185,80,0.08)', border: 'rgba(63,185,80,0.2)' },
          medium: { bg: 'rgba(210,153,34,0.08)', border: 'rgba(210,153,34,0.2)' },
          high: { bg: 'rgba(248,81,73,0.08)', border: 'rgba(248,81,73,0.2)' },
        };
        const rc = riskColors[risk] || riskColors.low;
        
        return `
          <div class="action-card" style="border-left:3px solid ${risk === 'high' ? 'var(--danger)' : risk === 'medium' ? 'var(--warning)' : 'var(--success)'}">
            <div class="action-card-header">
              <span class="action-card-title">
                <code style="font-size:13px">${escapeHtml(action.component || '')}.${escapeHtml(action.action || '')}</code>
              </span>
              <span class="risk-badge ${risk}">${escapeHtml(risk)} risk</span>
            </div>
            <div class="action-card-body">
              <pre style="margin:0;font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;background:var(--bg-primary);padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border)">${escapeHtml(paramsStr)}</pre>
            </div>
            <div class="action-card-footer">
              <button class="btn-success" onclick="approveAction('${action.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg>
                Approve
              </button>
              <button class="btn-danger" onclick="rejectAction('${action.id}')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                Reject
              </button>
              <span class="timestamp">${timestamp}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function approveAction(id) {
      fetch(`${API_BASE}/api/actions/${id}/approve`, {
        method: 'POST',
        headers: getHeaders()
      })
        .then(r => r.json())
        .then(data => {
          showToast('Action approved', 'success');
          actionHistory.unshift({ id, status: 'approved', time: new Date().toLocaleString() });
          refreshPending();
        })
        .catch(err => showToast('Failed: ' + err.message, 'error'));
    }

    function rejectAction(id) {
      fetch(`${API_BASE}/api/actions/${id}/reject`, {
        method: 'POST',
        headers: getHeaders()
      })
        .then(r => r.json())
        .then(data => {
          showToast('Action rejected', 'info');
          actionHistory.unshift({ id, status: 'rejected', time: new Date().toLocaleString() });
          refreshPending();
        })
        .catch(err => showToast('Failed: ' + err.message, 'error'));
    }

    function approveAll() {
      fetch(`${API_BASE}/api/actions/`, { headers: getHeaders() })
        .then(r => r.json())
        .then(data => {
          const pending = data.pending || [];
          if (pending.length === 0) { showToast('No pending actions', 'info'); return; }
          
          Promise.all(pending.map(a => 
            fetch(`${API_BASE}/api/actions/${a.id}/approve`, {
              method: 'POST',
              headers: getHeaders()
            }).then(r => r.json())
          )).then(() => {
            showToast(`${pending.length} actions approved`, 'success');
            refreshPending();
          });
        })
        .catch(err => showToast('Failed: ' + err.message, 'error'));
    }

    function rejectAll() {
      fetch(`${API_BASE}/api/actions/`, { headers: getHeaders() })
        .then(r => r.json())
        .then(data => {
          const pending = data.pending || [];
          if (pending.length === 0) { showToast('No pending actions', 'info'); return; }
          
          Promise.all(pending.map(a => 
            fetch(`${API_BASE}/api/actions/${a.id}/reject`, {
              method: 'POST',
              headers: getHeaders()
            }).then(r => r.json())
          )).then(() => {
            showToast(`${pending.length} actions rejected`, 'info');
            refreshPending();
          });
        })
        .catch(err => showToast('Failed: ' + err.message, 'error'));
    }

    // Auto-refresh
    setInterval(refreshPending, 10000);
    
    // Init
    document.addEventListener('DOMContentLoaded', refreshPending);
  </script>
</body>
</html>
