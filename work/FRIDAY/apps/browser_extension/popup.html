<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 300px; background: #050810; color: white; font-family: sans-serif; padding: 10px; }
        input { width: 100%; background: #1a2040; color: white; border: 1px solid #7C3AED; padding: 5px; }
        #response { margin-top: 10px; font-size: 12px; color: #06B6D4; }
    </style>
</head>
<body>
    <h3>Friday Assistant</h3>
    <input type="text" id="msg" placeholder="Ask Friday...">
    <div id="response"></div>
    <script>
        document.getElementById('msg').onkeypress = (e) => {
            if (e.key === 'Enter') {
                chrome.runtime.sendMessage({ action: "ask_friday", message: e.target.value }, (r) => {
                    document.getElementById('response').innerText = r.response;
                });
            }
        };
    </script>
</body>
</html>
